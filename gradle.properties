org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The app version. The Release workflow bumps both (see CONTRIBUTING.md):
# versionCode is major * 10000 + minor * 100 + patch, so 1.2.3 is 10203.
# F-Droid reads them from here to build each release.
versionName=0.3.6
versionCode=306
# Reuse the configured build between runs (much faster repeat builds).
org.gradle.configuration-cache=true
