# Publishes a signed release APK on the Releases page.
#
# Every push to main releases what's under [Unreleased] in CHANGELOG.md, as a patch (1.2.3 → 1.2.4).
# Pushes with nothing there (dependency bumps, CI tweaks) don't release. Put [minor] or [major] in
# the pushed commit's message (a PR's title does, in its merge commit) to bump that instead, or
# [no release] to hold the changes for a later release.
#
# By hand: Actions tab → "Release" → "Run workflow" on main, picking patch, minor or major.
#
# Either way it turns what's under [Unreleased] in CHANGELOG.md into the release (scripts/prepare_release.py
# bumps gradle.properties, dates the changelog section and writes the store changelog), builds and
# tests it, and only then pushes a "Release x.y.z" commit and its tag and publishes.
#
# A version tag pushed by hand (git tag v0.4.0 && git push origin v0.4.0) also publishes, as long
# as gradle.properties already says that version.
#
# Actions are pinned to commits (the tag is in the comment), since this job holds the signing key
# and can push to main; Dependabot proposes updates.
#
# Needs these repository secrets: KEYSTORE_BASE64 (the keystore file, base64), KEYSTORE_PASSWORD,
# KEY_ALIAS and KEY_PASSWORD.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version goes up (1.2.3 → patch 1.2.4, minor 1.3.0, major 2.0.0)
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

# One at a time. A push that lands mid-release waits (GitHub keeps only the newest waiting run,
# which is enough: it checks main as it is then), and releases whatever is still unreleased.
concurrency: release

jobs:
  # Whether this run releases, and how: "prepare" bumps the version from the changelog first,
  # "tag" publishes the version gradle.properties already has.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      bump: ${{ steps.plan.outputs.bump }}
    steps:
      # A push to main checks main as it is now, which a release that ran first may have moved on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_type == 'branch' && github.ref_name || '' }}

      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_BUMP: ${{ inputs.bump }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          shopt -s nocasematch
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "mode=prepare" >> "$GITHUB_OUTPUT"
            echo "bump=$INPUT_BUMP" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "mode=tag" >> "$GITHUB_OUTPUT"
          elif [[ "$MESSAGE" == *"[no release]"* ]]; then
            echo "::notice::[no release] in the commit message, so no release"
          elif ! python3 scripts/prepare_release.py --pending; then
            echo "::notice::Nothing under [Unreleased] in CHANGELOG.md, so no release"
          else
            bump=patch
            if [[ "$MESSAGE" == *"[major]"* ]]; then bump=major
            elif [[ "$MESSAGE" == *"[minor]"* ]]; then bump=minor; fi
            echo "mode=prepare" >> "$GITHUB_OUTPUT"
            echo "bump=$bump" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing a $bump version"
          fi

  release:
    needs: plan
    if: needs.plan.outputs.mode != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_type == 'branch' && github.ref_name || '' }}

      - name: Prepare the release
        if: needs.plan.outputs.mode == 'prepare'
        env:
          BUMP: ${{ needs.plan.outputs.bump }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run the release from main, not $GITHUB_REF_NAME"
            exit 1
          fi
          version=$(python3 scripts/prepare_release.py "$BUMP")
          git config user.name "github-actions[bot]"
          git config user.email "41898583+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties CHANGELOG.md fastlane/metadata/android/en-US/changelogs
          git commit -qm "Release $version"
          git tag "v$version"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Check the version
        id: version
        run: |
          v="${RELEASE_VERSION:-$GITHUB_REF_NAME}"
          v="${v#v}"
          name=$(sed -n 's/^versionName=//p' gradle.properties)
          code=$(sed -n 's/^versionCode=//p' gradle.properties)
          if [ "$v" != "$name" ]; then
            echo "::error::Releasing $v, but gradle.properties says versionName=$name"
            exit 1
          fi
          if ! [[ "$v" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::The version must look like 1.2.3, not '$v'"
            exit 1
          fi
          # 1.2.3 -> 10203, so every release installs over the one before.
          want=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          if [ "$code" != "$want" ]; then
            echo "::error::versionCode for $v should be $want, but gradle.properties says $code"
            exit 1
          fi
          echo "name=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Unpack the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret isn't set, so the release can't be signed"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease

      # Pushed with the workflow's own token, which doesn't start workflows, so this push doesn't
      # set off another release.
      - name: Push the release commit and tag
        if: needs.plan.outputs.mode == 'prepare'
        run: git push --atomic origin HEAD:main "v$RELEASE_VERSION"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          apk="phases-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          # This version's CHANGELOG.md section, if there is one, goes above the generated notes.
          awk -v v="$VERSION" '
            /^## \[/ { if (on) exit; on = index($0, "## [" v "]") == 1; next }
            on && !/^\[[^]]*\]: /' CHANGELOG.md > notes.md
          gh release create "v$VERSION" "$apk" "$apk.sha256" \
            --title "Phases $VERSION" \
            --target "$(git rev-parse HEAD)" \
            --notes-file notes.md \
            --generate-notes
