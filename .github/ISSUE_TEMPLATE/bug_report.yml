name: Bug report
description: Something in Phases doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the phase editor for Work
        2. ...
  - type: input
    id: version
    attributes:
      label: Phases version
      description: Settings → About, or the release you installed.
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: Pixel 8, Android 16
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Optional. A screen recording helps a lot with gesture problems.
